<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Стандартные протоколы</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="testing.html">← Назад</a><div class="crumb">Процедуры · выбор протокола тестирования</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><div class="panel"><div class="section-title"><h2>Стандартные протоколы</h2><span class="muted">Данные приходят из C++ ядра</span></div><div id="list" class="choice-list"><div class="empty">Загрузка…</div></div></div></main></div><script src="app.js"></script><script>(async()=>{try{const j=await api('/api/v1/protocols');$('list').innerHTML=j.items.map(p=>`<a class="choice" href="test-run.html?source=standard&id=${encodeURIComponent(p.id)}"><div class="grow"><strong>${esc(p.name)}</strong><span class="muted">${esc(p.description||'')}</span></div><span class="status ${p.implemented?'running':'fault'}">${p.implemented?'Доступен':'Не реализован'}</span></a>`).join('')||'<div class="empty">Нет протоколов</div>'}catch(e){$('list').innerHTML=`<div class="dangerbox">${esc(e.message)}</div>`}})();</script></body></html>
