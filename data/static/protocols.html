<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Протоколы — Yadro</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><div class="brand">YADRO / ПРОТОКОЛЫ</div><nav><a href="/index.html">Управление</a><a class="active" href="/protocols.html">Протоколы</a><a href="/profiles.html">Профили</a><a href="/patients.html">Пациенты</a><a href="/settings.html">Настройки</a></nav></header><main class="wrap"><div class="page-title"><div><h1>Стандартные протоколы тестирования</h1><div class="small">Запуск разрешён только для протоколов с подтверждёнными параметрами.</div></div></div><div id="list" class="protocol-list"></div></main><script>async function api(p,m='GET',b){const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.message||'Ошибка');return j}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const {items}=await api('/api/v1/protocols');document.getElementById('list').innerHTML=items.map(p=>`<div class="protocol-item ${p.implemented?'':'disabled'}"><span class="badge ${p.implemented?'':'pending'}">${p.implemented?'готов':'требует верификации'}</span><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p>${p.intervals.length?`<div class="table-wrap"><table><thead><tr><th>Ступень</th><th>Мин</th><th>км/ч</th><th>Уклон %</th></tr></thead><tbody>${p.intervals.map((x,i)=>`<tr><td>${i+1}</td><td>${(x.duration_seconds/60).toFixed(0)}</td><td>${x.speed_kmh.toFixed(1)}</td><td>${x.incline_percent.toFixed(1)}</td></tr>`).join('')}</tbody></table></div>`:''}<div class="button-row"><button class="btn-primary" ${p.implemented?'':'disabled'} onclick="run('${p.id}')">Запустить</button></div></div>`).join('')}async function run(id){if(!confirm('Запустить выбранный протокол?'))return;try{await api('/api/v1/control/start','POST',{mode:'protocol',program_id:id});location.href='/index.html'}catch(e){alert(e.message)}}setInterval(()=>api('/api/v1/heartbeat','POST',{}).catch(()=>{}),1000);load().catch(e=>document.getElementById('list').textContent=e.message);</script></body></html>
