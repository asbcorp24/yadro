<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Единицы измерения</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="settings.html">← Назад</a><div class="crumb">Настройки · переключение единиц измерения физических величин</div></header><main class="content"><section class="panel"><div class="form-grid"><div class="field"><label>Расстояние</label><select id="distance"><option value="km">км — километр</option><option value="m">м — метр</option><option value="mile">миля</option></select></div><div class="field"><label>Скорость</label><select id="speed"><option value="kmh">км/ч</option><option value="ms">м/с</option><option value="mph">миля/ч</option></select></div><div class="field"><label>Угол</label><select id="angle"><option value="percent">% — процент уклона</option><option value="degree">град — градус</option></select></div><div class="field"><label>Энергия</label><select id="energy"><option value="kcal">ккал</option><option value="kj">кДж</option></select></div><div class="field"><label>Мощность</label><select id="power"><option value="kw">кВт</option><option value="w">Вт</option></select></div><div class="field"><label>Аэробная</label><select id="aerobic"><option value="ml_min_kg">мл/мин/кг</option><option value="met">MET</option></select></div></div><div class="toolbar" style="margin-top:18px"><button id="save" class="btn success big">Сохранить</button></div></section></main></div><script src="app.js"></script><script>(async()=>{const s=await loadSettings();Object.entries(s.units).forEach(([k,v])=>{if($(k))$(k).value=v})})();$('save').onclick=async()=>{const units={distance:$('distance').value,speed:$('speed').value,angle:$('angle').value,energy:$('energy').value,power:$('power').value,aerobic:$('aerobic').value};try{await api('/api/v1/settings','POST',{units});toast('Единицы сохранены')}catch(e){alert(e.message)}};</script></body></html>
