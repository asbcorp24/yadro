<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Протокол тестирования</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="protocols.html">← Назад</a><div id="title" class="crumb">Тестирование · стандартный протокол</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><div class="split"><section class="panel"><div class="section-title"><div><h2 id="name">Протокол</h2><div id="description" class="muted"></div></div><span id="availability" class="status">Загрузка…</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Ступень</th><th>Длительность</th><th>Скорость</th><th>Уклон</th><th>Ускорение</th></tr></thead><tbody id="steps"></tbody></table></div></section><section class="panel"><h2>Параметры процедуры</h2><div class="metric-grid"><div class="metric"><div class="label">Ступеней</div><div id="stepCount" class="value">0</div></div><div class="metric"><div class="label">Общее время</div><div id="duration" class="value">00:00:00</div></div><div class="metric"><div class="label">Макс. скорость</div><div><span id="maxSpeed" class="value">0</span><span class="unit">км/ч</span></div></div><div class="metric"><div class="label">Макс. уклон</div><div><span id="maxIncline" class="value">0</span><span class="unit">%</span></div></div></div><div id="warning" class="notice" style="margin-top:16px">Перед запуском выберите пациента, если процедура должна попасть в его историю.</div><div class="hero-actions"><button id="run" class="start-btn">Далее к выполнению</button></div></section></div></main></div><script src="app.js"></script><script>const id=qs('id');let protocol=null;(async()=>{try{const j=await api('/api/v1/protocols');protocol=j.items.find(x=>x.id===id);if(!protocol)throw new Error('Протокол не найден');$('name').textContent=protocol.name;$('title').textContent='Тестирование · '+protocol.name;$('description').textContent=protocol.description||'';$('availability').textContent=protocol.implemented?'Доступен':'Недоступен';$('availability').className='status '+(protocol.implemented?'running':'fault');$('steps').innerHTML=(protocol.intervals||[]).map((x,i)=>`<tr><td>${i+1}</td><td>${fmtTime(x.duration_seconds)}</td><td>${Number(x.speed_kmh).toFixed(1)} км/ч</td><td>${Number(x.incline_percent).toFixed(1)} %</td><td>${x.acceleration_level??'—'}</td></tr>`).join('');$('stepCount').textContent=(protocol.intervals||[]).length;$('duration').textContent=fmtTime((protocol.intervals||[]).reduce((s,x)=>s+Number(x.duration_seconds||0),0));$('maxSpeed').textContent=Math.max(0,...(protocol.intervals||[]).map(x=>Number(x.speed_kmh||0))).toFixed(1);$('maxIncline').textContent=Math.max(0,...(protocol.intervals||[]).map(x=>Number(x.incline_percent||0))).toFixed(1);$('run').disabled=!protocol.implemented;$('warning').textContent=protocol.implemented?'Проверьте пациента и параметры ступеней перед переходом к экрану выполнения.':'Этот вариант протокола не запускается: точная таблица REATERRA для него пока не подтверждена.'}catch(e){$('warning').className='dangerbox';$('warning').textContent=e.message;$('run').disabled=true}})();$('run').onclick=()=>{if(protocol?.implemented)location.href='test-run.html?source=standard&id='+encodeURIComponent(protocol.id)};</script></body></html>
