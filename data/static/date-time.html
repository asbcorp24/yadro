<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REMOTION — время и дата</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="settings.html">← Назад</a><div class="crumb">Настройки · время и дата</div></header><main class="content"><section class="panel"><h2>Системное время</h2><div class="form-grid"><div class="field"><label>Дата</label><input id="date" type="date"></div><div class="field"><label>Время</label><input id="time" type="time" step="1"></div><div class="field"><label>Часовой пояс</label><select id="tz"><option>UTC+3</option><option>UTC+4</option><option>UTC</option></select></div></div><div class="notice" style="margin-top:16px">Все сенсоры должны быть привязаны к общей шкале времени. Здесь пока настраивается только интерфейс; системная синхронизация и timestamp-служба будут реализованы в ядре.</div></section></main></div><script src="app.js"></script><script>const d=new Date();$('date').value=d.toISOString().slice(0,10);$('time').value=d.toTimeString().slice(0,8);</script></body></html>
