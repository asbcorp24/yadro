<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Свободный бег</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="index.html">← Назад</a><div class="crumb">Процедуры · свободный бег</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><section class="panel"><div class="metric-grid"><div class="metric"><div class="label">Мощность</div><div><span id="power" class="value">0.000</span><span id="powerUnit" class="unit">кВт</span></div></div><div class="metric"><div class="label">Расстояние</div><div><span id="distance" class="value">0.000</span><span id="distanceUnit" class="unit">км</span></div></div><div class="metric"><div class="label">Энергия</div><div><span id="energy" class="value">0.000</span><span id="energyUnit" class="unit">ккал</span></div></div><div class="metric"><div class="label">Пульс</div><div><span id="hr" class="value">0</span><span class="unit">уд/мин</span></div></div></div><div class="split" style="margin-top:18px"><div><div class="metric"><div class="label">Время бега</div><div id="elapsed" class="value">00:00:00</div></div><div class="hero-actions"><button id="direction" class="btn big">← ВПЕРЁД →</button><button id="start" class="start-btn">▶ ПУСК</button><button id="stop" class="stop-btn">■ СТОП</button></div></div><div class="run-controls"><div><h3>Угол подъёма</h3><div class="adjust"><button data-kind="incline" data-delta="-0.5">−</button><div class="readout"><span id="incline">0.0</span> <span id="inclineUnit">%</span></div><button data-kind="incline" data-delta="0.5">+</button></div></div><div><h3>Скорость</h3><div class="adjust"><button data-kind="speed" data-delta="-0.1">−</button><div class="readout"><span id="speed">1.0</span> км/ч</div><button data-kind="speed" data-delta="0.1">+</button></div></div></div></div><div id="status" class="status" style="margin-top:18px">Остановлена</div><div id="notice" class="muted" style="margin-top:8px"></div></section></main><button id="globalEstop" class="estop">STOP</button></div><script src="app.js"></script><script>function render(t){if(!t)return;const p=convertPower(t.mechanical_power_w_estimate),d=convertDistance(t.distance_km),en=convertEnergy(t.energy_kcal_estimate),inc=convertIncline(t.target_incline_percent);$('power').textContent=p.value.toFixed(3);$('powerUnit').textContent=p.unit;$('distance').textContent=d.value.toFixed(3);$('distanceUnit').textContent=d.unit;$('energy').textContent=en.value.toFixed(3);$('energyUnit').textContent=en.unit;$('hr').textContent=t.heart_rate_bpm;$('elapsed').textContent=fmtTime(t.elapsed_seconds);$('incline').textContent=inc.value.toFixed(1);$('inclineUnit').textContent=inc.unit;$('speed').textContent=t.target_speed_kmh.toFixed(1);$('direction').textContent=t.direction==='forward'?'← ВПЕРЁД →':'← НАЗАД →';$('status').textContent=humanState(t.state);$('status').className='status '+t.state;$('notice').textContent=t.notice||''}document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=async()=>{if(!yadroState)return;const d=Number(b.dataset.delta);try{const s=b.dataset.kind==='speed'?Math.max(0,yadroState.target_speed_kmh+d):yadroState.target_speed_kmh;const i=b.dataset.kind==='incline'?Math.max(0,yadroState.target_incline_percent+d):yadroState.target_incline_percent;await setTargets(s,i)}catch(e){alert(e.message)}});$('direction').onclick=async()=>{if(!yadroState)return;try{await api('/api/v1/control/direction','POST',{direction:yadroState.direction==='forward'?'reverse':'forward'})}catch(e){alert(e.message)}};$('start').onclick=()=>api('/api/v1/control/start','POST',{mode:'free'}).catch(e=>alert(e.message));$('stop').onclick=()=>api('/api/v1/control/stop','POST',{}).catch(e=>alert(e.message));setInterval(()=>pollState(render),300);pollState(render);</script></body></html>
