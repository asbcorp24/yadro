<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор пароля</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="settings.html">← Назад</a><div class="crumb">Настройки · редактор пароля локального пульта</div></header><main class="content"><section class="panel"><div class="notice">Этот PIN предназначен только для блокировки web-интерфейса оператора. Он не заменяет сетевую аутентификацию и не является границей безопасности C++ API.</div><div class="form-grid" style="margin-top:16px"><div class="field"><label>Новый PIN</label><input id="pin1" type="password" inputmode="numeric" maxlength="12"></div><div class="field"><label>Повторите PIN</label><input id="pin2" type="password" inputmode="numeric" maxlength="12"></div><div class="field"><label>Запрашивать PIN при открытии</label><select id="required"><option value="false">Нет</option><option value="true">Да</option></select></div></div><div class="toolbar" style="margin-top:18px"><button id="save" class="btn success">Сохранить</button><button id="disable" class="btn danger">Отключить PIN</button></div></section></main></div><script src="app.js"></script><script>async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}(async()=>{const s=await loadSettings();$('required').value=String(!!s.security?.pin_required)})();$('save').onclick=async()=>{const a=$('pin1').value,b=$('pin2').value;if(a!==b)return alert('PIN не совпадает');if(a.length<4)return alert('Минимум 4 символа');try{await api('/api/v1/settings','POST',{security:{pin_required:$('required').value==='true',operator_pin_sha256:await sha(a)}});sessionStorage.setItem('yadro-pin-ok','1');toast('PIN сохранён')}catch(e){alert(e.message)}};$('disable').onclick=async()=>{await api('/api/v1/settings','POST',{security:{pin_required:false,operator_pin_sha256:''}});sessionStorage.removeItem('yadro-pin-ok');toast('PIN отключён')};</script></body></html>
