<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REMOTION — выбор аккаунта</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><div class="brand">REMOTION</div><div class="crumb">Вход · выбор режима доступа</div></header><main class="content"><section class="panel"><div class="section-title"><div><h2>Выберите аккаунт</h2><div class="muted">Роль определяет доступные разделы интерфейса. До серверной авторизации это только UI-режим, не защита API.</div></div></div><div class="grid tiles"><button class="tile" data-role="admin"><div class="tile-icon">A</div><div><h2>Администратор</h2><p>Расширенные настройки, пользователи, сервисные функции и управление системой</p></div></button><button class="tile" data-role="service"><div class="tile-icon">S</div><div><h2>Сервисный аккаунт</h2><p>Калибровка, диагностика, внешние устройства, обновление ПО</p></div></button><button class="tile" data-role="doctor"><div class="tile-icon">DR</div><div><h2>Обычный пользователь</h2><p>Врач: пациенты, процедуры, результаты, статистика и реабилитационные программы</p></div></button><button class="tile" data-role="quick"><div class="tile-icon">▶</div><div><h2>Быстрый запуск</h2><p>Ограниченный режим: произвольная тренировка или готовый протокол без редактирования</p></div></button></div></section></main></div><script src="app.js"></script><script>document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{localStorage.setItem('remotion-role',b.dataset.role);location.href='index.html'});</script></body></html>
