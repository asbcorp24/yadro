<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Детализация пациента</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="patients.html">← Назад</a><div class="crumb">Пациенты · детализация</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><section id="card" class="panel"><div class="empty">Выберите пациента в базе</div></section></main></div><script src="app.js"></script><script>(async()=>{const sid=(await api('/api/v1/session/patient')).patient_id;if(!sid)return;const p=(await api('/api/v1/patients')).items.find(x=>x.id===sid);if(!p)return;$('card').innerHTML=`<div class="section-title"><h2>${esc([p.last_name,p.first_name,p.middle_name].filter(Boolean).join(' '))}</h2><span class="status ${p.account_active===false?'fault':'running'}">${p.account_active===false?'Аккаунт отключён':'Аккаунт активен'}</span></div><div class="metric-grid"><div class="metric"><div class="label">Пол</div><div class="value">${esc(p.sex||'—')}</div></div><div class="metric"><div class="label">Возраст</div><div class="value">${esc(p.age??'—')}</div></div><div class="metric"><div class="label">Вес</div><div class="value">${esc(p.weight_kg??'—')}<span class="unit">кг</span></div></div><div class="metric"><div class="label">Врач</div><div class="value" style="font-size:1.1rem">${esc(p.doctor||'—')}</div></div></div><div class="form-grid" style="margin-top:18px"><div class="field"><label>Диагноз</label><div>${esc(p.diagnosis||'—')}</div></div><div class="field"><label>Профиль</label><div>${esc(p.profile||'—')}</div></div><div class="field"><label>ID</label><div class="kbd">${esc(p.id)}</div></div></div><div class="toolbar" style="margin-top:18px"><a class="btn primary" href="patient-stats.html">Статистика</a><a class="btn" href="history.html">История процедур</a></div>`})();</script></body></html>
