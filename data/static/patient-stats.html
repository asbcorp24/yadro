<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статистика пациента</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="patients.html">← Назад</a><div class="crumb">Пациенты · статистика по учётной записи пациента</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><section class="panel"><h2 id="patientName">Данные пациента</h2><div id="stats" class="metric-grid"><div class="empty">Загрузка…</div></div></section></main></div><script src="app.js"></script><script>(async()=>{const id=(await api('/api/v1/session/patient')).patient_id;if(!id){$('stats').innerHTML='<div class="empty">Пациент не выбран</div>';return}const p=(await api('/api/v1/patients')).items.find(x=>x.id===id),h=(await api('/api/v1/history?patient_id='+encodeURIComponent(id))).items;$('patientName').textContent='Данные пациента · '+([p?.last_name,p?.first_name,p?.middle_name].filter(Boolean).join(' ')||id);const sum=(k)=>h.reduce((a,x)=>a+Number(x[k]||0),0),max=(k)=>h.reduce((a,x)=>Math.max(a,Number(x[k]||0)),0);$('stats').innerHTML=`<div class="metric"><div class="label">Суммарное расстояние</div><div class="value">${sum('distance_km').toFixed(3)}<span class="unit">км</span></div></div><div class="metric"><div class="label">Суммарное время</div><div class="value">${fmtTime(sum('duration_seconds'))}</div></div><div class="metric"><div class="label">Суммарная энергия</div><div class="value">${sum('energy_kcal_estimate').toFixed(2)}<span class="unit">ккал</span></div></div><div class="metric"><div class="label">Макс. ускорение</div><div class="value">${max('max_acceleration_m_s2').toFixed(3)}<span class="unit">м/с²</span></div></div><div class="metric"><div class="label">Макс. ЧСС</div><div class="value">${max('max_heart_rate_bpm')}<span class="unit">уд/мин</span></div></div><div class="metric"><div class="label">Процедур</div><div class="value">${h.length}</div></div>`})();</script></body></html>
