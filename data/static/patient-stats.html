<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статистика пациента</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="charts.css"></head><body><div class="app"><header class="topbar"><a class="back" href="patients.html">← Назад</a><div class="crumb">Пациенты · расширенная статистика</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><section class="panel"><div class="section-title"><div><h2 id="patientName">Статистика пациента</h2><div class="muted">Динамика процедур строится по сохранённой истории C++ ядра</div></div><a class="btn" href="patient-history.html">История пациента</a></div><div class="stats-filter"><div class="field"><label>Период</label><select id="period"><option value="all">Всё время</option><option value="30">Последние 30 дней</option><option value="90">Последние 90 дней</option><option value="365">Последний год</option></select></div><div class="field"><label>Режим</label><select id="mode"><option value="">Все режимы</option><option value="free">Свободный бег</option><option value="protocol">Тестирование</option><option value="profile">Профиль</option><option value="heart_rate">По ЧСС</option></select></div></div><div id="stats" class="metric-grid"><div class="empty">Загрузка…</div></div></section><div class="chart-grid-layout"><section class="panel chart-panel"><h3>Расстояние по процедурам</h3><div id="distanceChart" class="chart"></div></section><section class="panel chart-panel"><h3>Средняя скорость</h3><div id="speedChart" class="chart"></div></section><section class="panel chart-panel"><h3>Максимальная ЧСС</h3><div id="hrChart" class="chart"></div></section><section class="panel chart-panel"><h3>Энергия по процедурам</h3><div id="energyChart" class="chart"></div></section><section class="panel chart-panel"><h3>Распределение процедур</h3><div id="modeChart" class="chart"></div></section><section class="panel chart-panel"><h3>Процедуры по месяцам</h3><div id="monthChart" class="chart"></div></section></div></main></div><script src="app.js"></script><script src="charts.js"></script><script>let patient=null,history=[];function sessionLabel(s){return humanSession(s)||s||'Другое'}function filtered(){let rows=[...history];const days=$('period').value;if(days!=='all'){const min=Date.now()-Number(days)*86400000;rows=rows.filter(x=>{const t=Date.parse(x.started_at||'');return Number.isFinite(t)&&t>=min})}const mode=$('mode').value;if(mode)rows=rows.filter(x=>x.session===mode);return rows.sort((a,b)=>String(a.started_at||'').localeCompare(String(b.started_at||'')))}function render(){const h=filtered(),sum=k=>h.reduce((a,x)=>a+Number(x[k]||0),0),max=k=>h.reduce((a,x)=>Math.max(a,Number(x[k]||0)),0),avg=k=>h.length?sum(k)/h.length:0;$('stats').innerHTML=`<div class="metric"><div class="label">Процедур</div><div class="value">${h.length}</div></div><div class="metric"><div class="label">Суммарное расстояние</div><div class="value">${sum('distance_km').toFixed(2)}<span class="unit">км</span></div></div><div class="metric"><div class="label">Суммарное время</div><div class="value">${fmtTime(sum('duration_seconds'))}</div></div><div class="metric"><div class="label">Средняя скорость</div><div class="value">${avg('average_speed_kmh').toFixed(2)}<span class="unit">км/ч</span></div></div><div class="metric"><div class="label">Макс. скорость</div><div class="value">${max('max_speed_kmh').toFixed(2)}<span class="unit">км/ч</span></div></div><div class="metric"><div class="label">Макс. уклон</div><div class="value">${max('max_incline_percent').toFixed(1)}<span class="unit">%</span></div></div><div class="metric"><div class="label">Макс. ускорение</div><div class="value">${max('max_acceleration_m_s2').toFixed(3)}<span class="unit">м/с²</span></div></div><div class="metric"><div class="label">Макс. ЧСС</div><div class="value">${max('max_heart_rate_bpm').toFixed(0)}<span class="unit">уд/мин</span></div></div><div class="metric"><div class="label">Суммарная энергия</div><div class="value">${sum('energy_kcal_estimate').toFixed(1)}<span class="unit">ккал</span></div></div><div class="metric"><div class="label">Макс. мощность</div><div class="value">${max('max_power_w_estimate').toFixed(0)}<span class="unit">Вт</span></div></div>`;const pts=h.map((x,i)=>({label:(x.started_at||'').slice(0,10)||String(i+1),distance:Number(x.distance_km||0),speed:Number(x.average_speed_kmh||0),hr:Number(x.max_heart_rate_bpm||0),energy:Number(x.energy_kcal_estimate||0)}));renderLineChart('distanceChart',pts,{x:d=>d.label,y:d=>d.distance,valueFmt:v=>v.toFixed(2),unit:'км'});renderLineChart('speedChart',pts,{x:d=>d.label,y:d=>d.speed,valueFmt:v=>v.toFixed(1),unit:'км/ч'});renderLineChart('hrChart',pts,{x:d=>d.label,y:d=>d.hr,valueFmt:v=>v.toFixed(0),unit:'уд/мин'});renderBarChart('energyChart',pts.slice(-12),{label:d=>d.label.slice(5),value:d=>d.energy,valueFmt:v=>v.toFixed(0),unit:'ккал'});const byMode=new Map();h.forEach(x=>byMode.set(sessionLabel(x.session),(byMode.get(sessionLabel(x.session))||0)+1));renderDonutChart('modeChart',[...byMode].map(([label,value])=>({label,value})));const months=groupByMonth(h).map(([label,rows])=>({label,value:rows.length}));renderBarChart('monthChart',months,{valueFmt:v=>v.toFixed(0)});enhanceBootstrap()}async function load(){const id=(await api('/api/v1/session/patient')).patient_id;if(!id){$('patientName').textContent='Пациент не выбран';$('stats').innerHTML='<div class="empty">Выберите пациента в базе пациентов</div>';['distanceChart','speedChart','hrChart','energyChart','modeChart','monthChart'].forEach(x=>chartEmpty($(x)));return}patient=(await api('/api/v1/patients')).items.find(x=>x.id===id);history=(await api('/api/v1/history?patient_id='+encodeURIComponent(id))).items;$('patientName').textContent='Статистика · '+([patient?.last_name,patient?.first_name,patient?.middle_name].filter(Boolean).join(' ')||id);render()}$('period').onchange=render;$('mode').onchange=render;load().catch(e=>$('stats').innerHTML=`<div class="dangerbox">${esc(e.message)}</div>`);</script></body></html>
