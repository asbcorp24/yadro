<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Общая статистика</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="charts.css"></head><body><div class="app"><header class="topbar"><a class="back" href="index.html">← Назад</a><div class="crumb">Статистика · все пациенты и процедуры</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><section class="panel"><div class="section-title"><div><h2>Сводная статистика</h2><div class="muted">Агрегация по всей сохранённой истории процедур</div></div><a class="btn" href="history.html">Открыть историю</a></div><div class="stats-filter"><div class="field"><label>Период</label><select id="period"><option value="all">Всё время</option><option value="30">30 дней</option><option value="90">90 дней</option><option value="365">1 год</option></select></div><div class="field"><label>Пациент</label><select id="patient"><option value="">Все пациенты</option></select></div><div class="field"><label>Режим</label><select id="mode"><option value="">Все режимы</option><option value="free">Свободный бег</option><option value="protocol">Тестирование</option><option value="profile">Профиль</option><option value="heart_rate">По ЧСС</option></select></div></div><div id="stats" class="metric-grid"><div class="empty">Загрузка…</div></div></section><div class="chart-grid-layout"><section class="panel chart-panel"><h3>Количество процедур по месяцам</h3><div id="monthCount" class="chart"></div></section><section class="panel chart-panel"><h3>Дистанция по месяцам</h3><div id="monthDistance" class="chart"></div></section><section class="panel chart-panel"><h3>Режимы процедур</h3><div id="modeChart" class="chart"></div></section><section class="panel chart-panel"><h3>Средняя максимальная ЧСС по месяцам</h3><div id="hrChart" class="chart"></div></section><section class="panel chart-panel"><h3>Энергия по месяцам</h3><div id="energyChart" class="chart"></div></section><section class="panel chart-panel"><h3>Активность пациентов</h3><div id="patientRanking" class="ranking"></div></section></div></main></div><script src="app.js"></script><script src="charts.js"></script><script>let history=[],patients=[];function pname(id){const p=patients.find(x=>x.id===id);return p?[p.last_name,p.first_name].filter(Boolean).join(' ')||p.id:(id||'Без пациента')}function filtered(){let h=[...history];const d=$('period').value;if(d!=='all'){const min=Date.now()-Number(d)*86400000;h=h.filter(x=>Date.parse(x.started_at||'')>=min)}const p=$('patient').value,m=$('mode').value;if(p)h=h.filter(x=>x.patient_id===p);if(m)h=h.filter(x=>x.session===m);return h}function render(){const h=filtered(),sum=k=>h.reduce((a,x)=>a+Number(x[k]||0),0),max=k=>h.reduce((a,x)=>Math.max(a,Number(x[k]||0)),0),avg=k=>h.length?sum(k)/h.length:0,uniq=new Set(h.map(x=>x.patient_id).filter(Boolean));$('stats').innerHTML=`<div class="metric"><div class="label">Процедур</div><div class="value">${h.length}</div></div><div class="metric"><div class="label">Пациентов</div><div class="value">${uniq.size}</div></div><div class="metric"><div class="label">Расстояние</div><div class="value">${sum('distance_km').toFixed(1)}<span class="unit">км</span></div></div><div class="metric"><div class="label">Время</div><div class="value">${fmtTime(sum('duration_seconds'))}</div></div><div class="metric"><div class="label">Средняя скорость</div><div class="value">${avg('average_speed_kmh').toFixed(2)}<span class="unit">км/ч</span></div></div><div class="metric"><div class="label">Макс. скорость</div><div class="value">${max('max_speed_kmh').toFixed(1)}<span class="unit">км/ч</span></div></div><div class="metric"><div class="label">Макс. ЧСС</div><div class="value">${max('max_heart_rate_bpm').toFixed(0)}<span class="unit">уд/мин</span></div></div><div class="metric"><div class="label">Энергия</div><div class="value">${sum('energy_kcal_estimate').toFixed(0)}<span class="unit">ккал</span></div></div>`;const months=groupByMonth(h);renderBarChart('monthCount',months.map(([label,rows])=>({label,value:rows.length})),{valueFmt:v=>v.toFixed(0)});renderBarChart('monthDistance',months.map(([label,rows])=>({label,value:rows.reduce((s,x)=>s+Number(x.distance_km||0),0)})),{valueFmt:v=>v.toFixed(1),unit:'км'});const modes=new Map();h.forEach(x=>modes.set(humanSession(x.session),(modes.get(humanSession(x.session))||0)+1));renderDonutChart('modeChart',[...modes].map(([label,value])=>({label,value})));renderLineChart('hrChart',months.map(([label,rows])=>({label,value:rows.length?rows.reduce((s,x)=>s+Number(x.max_heart_rate_bpm||0),0)/rows.length:0})),{valueFmt:v=>v.toFixed(0),unit:'уд/мин'});renderBarChart('energyChart',months.map(([label,rows])=>({label,value:rows.reduce((s,x)=>s+Number(x.energy_kcal_estimate||0),0)})),{valueFmt:v=>v.toFixed(0),unit:'ккал'});const ranks=new Map();h.forEach(x=>ranks.set(x.patient_id||'',(ranks.get(x.patient_id||'')||0)+1));const rr=[...ranks].sort((a,b)=>b[1]-a[1]).slice(0,10),mx=Math.max(1,...rr.map(x=>x[1]));$('patientRanking').innerHTML=rr.map(([id,n],i)=>`<div class="ranking-row"><strong>${i+1}. ${esc(pname(id))}</strong><div class="ranking-bar"><div style="width:${n/mx*100}%"></div></div><span>${n}</span></div>`).join('')||'<div class="empty">Нет данных</div>';enhanceBootstrap()}async function load(){patients=(await api('/api/v1/patients')).items;history=(await api('/api/v1/history')).items;$('patient').innerHTML='<option value="">Все пациенты</option>'+patients.map(p=>`<option value="${esc(p.id)}">${esc(pname(p.id))}</option>`).join('');render()}['period','patient','mode'].forEach(id=>$(id).onchange=render);load().catch(e=>$('stats').innerHTML=`<div class="dangerbox">${esc(e.message)}</div>`);</script></body></html>
