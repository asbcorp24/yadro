<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REMOTION — настройка БОС</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="biofeedback.html">← Назад</a><div id="title" class="crumb">БОС · профиль</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><div class="split"><section class="panel"><h2 id="profileName">Профиль БОС</h2><div class="form-grid"><div class="field"><label>Целевая длина шага, см</label><input type="number" value="60" min="10" max="150"></div><div class="field"><label>Целевая высота шага, см</label><input type="number" value="8" min="0" max="50"></div><div class="field"><label>Допуск, %</label><input type="number" value="10" min="1" max="50"></div><div class="field"><label>Макс. время контакта, с</label><input type="number" value="0.8" min="0.1" max="3" step="0.1"></div><div class="field"><label>Целевая нагрузка, %</label><input type="number" value="50" min="0" max="100"></div></div><div id="profileNotice" class="notice" style="margin-top:16px"></div><div class="hero-actions"><button class="start-btn" id="start">Старт</button></div></section><section class="panel"><h2>Контроль выполнения</h2><div class="metric-grid"><div class="metric"><div class="label">Длина шага L</div><div class="value">—</div></div><div class="metric"><div class="label">Длина шага R</div><div class="value">—</div></div><div class="metric"><div class="label">Высота шага</div><div class="value">—</div></div><div class="metric"><div class="label">Время контакта</div><div class="value">—</div></div><div class="metric"><div class="label">Нагрузка L/R</div><div class="value">—</div></div><div class="metric"><div class="label">Фаза шага</div><div class="value">—</div></div></div><div class="footer-note">Фактические показатели появятся после подключения модулей кинематики, давления и/или ФЭС.</div></section></div></main><button id="globalEstop" class="estop">STOP</button></div><script src="app.js"></script><script>const p=Number(qs('profile','1')),names={1:'Профиль 1 — длина шага + суставные углы',2:'Профиль 2 — длина/высота шага + нагрузка',3:'Профиль 3 — игровой: лес/город/тропинка',4:'Профиль 4 — игровой с проектором',5:'Профиль 5 — ФЭС в цикле шага'};$('profileName').textContent=names[p]||'Профиль БОС';$('title').textContent='БОС · '+$('profileName').textContent;$('profileNotice').textContent=p===5?'Для этого профиля требуется модуль ФЭС с синхронизацией по фазам шага. Интерфейс не запускает стимуляцию без подключенного безопасного драйвера.':'Настройте параметры обратной связи и запускайте после проверки датчиков.';$('start').onclick=()=>alert('Экран подготовлен. Реальный запуск этого профиля будет подключён после реализации соответствующего драйвера/сценария в C++ ядре.');</script></body></html>
