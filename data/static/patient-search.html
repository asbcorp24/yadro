<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поиск пациента</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="patients.html">← Назад</a><div class="crumb">Пациенты · поиск</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><section class="panel"><div class="section-title"><h2>Поиск пациента</h2><a class="btn primary" href="patient-edit.html">+ Новый пациент</a></div><div class="form-grid"><div class="field"><label>ФИО / диагноз / врач</label><input id="query" autofocus placeholder="Введите часть фамилии, имени, диагноза или врача"></div><div class="field"><label>Пол</label><select id="sex"><option value="">Любой</option><option value="M">М</option><option value="F">Ж</option></select></div><div class="field"><label>Учётная запись</label><select id="account"><option value="">Любая</option><option value="active">Активна</option><option value="disabled">Отключена</option></select></div></div><div class="toolbar" style="margin-top:16px"><button id="clear" class="btn">Сбросить</button><span id="count" class="muted"></span></div><div class="table-wrap"><table class="table"><thead><tr><th>ФИО</th><th>Пол</th><th>Возраст</th><th>Вес</th><th>Диагноз</th><th>Врач</th><th>Аккаунт</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></section></main></div><script src="app.js"></script><script>let patients=[];function fullName(p){return[p.last_name,p.first_name,p.middle_name].filter(Boolean).join(' ')||p.id}function filtered(){const q=$('query').value.trim().toLowerCase(),sex=$('sex').value,account=$('account').value;return patients.filter(p=>{const text=[p.last_name,p.first_name,p.middle_name,p.diagnosis,p.doctor,p.id].join(' ').toLowerCase();if(q&&!text.includes(q))return false;if(sex&&p.sex!==sex)return false;if(account==='active'&&p.account_active===false)return false;if(account==='disabled'&&p.account_active!==false)return false;return true})}function render(){const rows=filtered();$('count').textContent=`Найдено: ${rows.length}`;$('tbody').innerHTML=rows.map(p=>`<tr><td>${esc(fullName(p))}</td><td>${esc(p.sex||'')}</td><td>${esc(p.age??'')}</td><td>${esc(p.weight_kg??'')}</td><td>${esc(p.diagnosis||'')}</td><td>${esc(p.doctor||'')}</td><td>${p.account_active===false?'Отключена':'Активна'}</td><td><div class="toolbar" style="margin:0"><button class="btn primary" data-select="${esc(p.id)}">Выбрать</button><a class="btn" href="patient-edit.html?id=${encodeURIComponent(p.id)}">Карточка</a></div></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Совпадений нет</td></tr>';document.querySelectorAll('[data-select]').forEach(b=>b.onclick=async()=>{await selectPatient(b.dataset.select);toast('Пациент выбран');setTimeout(()=>location.href='patients.html',400)});enhanceBootstrap()}async function load(){patients=(await api('/api/v1/patients')).items;render()}['query','sex','account'].forEach(id=>$(id).addEventListener(id==='query'?'input':'change',render));$('clear').onclick=()=>{$('query').value='';$('sex').value='';$('account').value='';render()};load().catch(e=>$('tbody').innerHTML=`<tr><td colspan="8"><div class="dangerbox">${esc(e.message)}</div></td></tr>`);</script></body></html>
