<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пользовательские протоколы</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="testing.html">← Назад</a><div class="crumb">Тестирование · пользовательские протоколы</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><section class="panel"><div class="section-title"><h2>Пользовательские протоколы</h2><a class="btn primary" href="user-protocol-editor.html">+ Новый протокол</a></div><div id="protocolList" class="choice-list"></div></section></main></div><script src="app.js"></script><script>async function load(){const items=(await api('/api/v1/user-protocols')).items;$('protocolList').innerHTML=items.map(p=>`<div class="choice"><div class="grow"><strong>${esc(p.name)}</strong><div class="muted">${esc(p.description||'')} · ${p.intervals.length} интервалов</div></div><div class="toolbar mb-0"><a class="btn" href="user-protocol-editor.html?id=${encodeURIComponent(p.id)}">Редактировать</a><a class="btn primary" href="test-run.html?source=user&id=${encodeURIComponent(p.id)}">Запустить</a></div></div>`).join('')||'<div class="empty">Пользовательские протоколы ещё не созданы</div>';enhanceBootstrap()}load();</script></body></html>
