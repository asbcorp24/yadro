<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пользовательские протоколы</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="testing.html">← Назад</a><div class="crumb">Реабилитация · редактор протокола тестирования</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><div class="split"><section class="panel"><div class="section-title"><h2>Протоколы</h2><button id="newBtn" class="btn primary">+ Новый</button></div><div id="protocolList" class="choice-list"></div></section><section class="panel"><div class="form-grid"><div class="field"><label>ID</label><input id="pid" placeholder="protocol_1"></div><div class="field"><label>Название</label><input id="pname"></div></div><div class="field" style="margin-top:12px"><label>Описание</label><textarea id="pdesc"></textarea></div><div class="section-title" style="margin-top:18px"><h3>Интервалы</h3><button id="addRow" class="btn">+ Добавить интервал</button></div><div class="table-wrap"><table class="table"><thead><tr><th>№</th><th>Скорость, км/ч</th><th>Время, с</th><th>Уклон, %</th><th>Разгон</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="toolbar" style="margin-top:16px"><button id="save" class="btn success">Сохранить</button><button id="run" class="btn primary">Запустить</button><button id="del" class="btn danger">Удалить</button></div></section></div></main></div><script src="app.js"></script><script>let items=[],current=null;function row(v={speed_kmh:.1,duration_seconds:60,incline_percent:0,acceleration_level:3}){const tr=document.createElement('tr');tr.innerHTML=`<td class="n"></td><td><input type="number" min="0" step="0.1" value="${v.speed_kmh}"></td><td><input type="number" min="1" step="1" value="${v.duration_seconds}"></td><td><input type="number" min="0" step="0.1" value="${v.incline_percent}"></td><td><select>${[1,2,3,4,5,6,7].map(x=>`<option ${x===v.acceleration_level?'selected':''}>${x}</option>`).join('')}</select></td><td><button class="btn danger">×</button></td>`;tr.querySelector('button').onclick=()=>{tr.remove();renumber()};$('rows').appendChild(tr);renumber()}function renumber(){[...$('rows').children].forEach((r,i)=>r.querySelector('.n').textContent=i+1)}function edit(p){current=p;$('pid').value=p?.id||('protocol_'+Date.now());$('pname').value=p?.name||'';$('pdesc').value=p?.description||'';$('rows').innerHTML='';(p?.intervals||[{speed_kmh:.1,duration_seconds:60,incline_percent:0,acceleration_level:3}]).forEach(row)}function payload(){return{id:$('pid').value.trim(),name:$('pname').value.trim(),description:$('pdesc').value.trim(),intervals:[...$('rows').children].map(r=>{const a=r.querySelectorAll('input,select');return{speed_kmh:Number(a[0].value),duration_seconds:Number(a[1].value),incline_percent:Number(a[2].value),acceleration_level:Number(a[3].value)}})}}async function load(){items=(await api('/api/v1/user-protocols')).items;$('protocolList').innerHTML=items.map(p=>`<div class="choice clickable" data-id="${p.id}"><div class="grow"><strong>${esc(p.name)}</strong><span class="muted">${p.intervals.length} интервалов</span></div><span>›</span></div>`).join('')||'<div class="empty">Пока нет пользовательских протоколов</div>';document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>edit(items.find(p=>p.id===x.dataset.id)))}$('newBtn').onclick=()=>edit(null);$('addRow').onclick=()=>row();$('save').onclick=async()=>{try{await api('/api/v1/user-protocols','POST',payload());toast('Протокол сохранён');await load()}catch(e){alert(e.message)}};$('del').onclick=async()=>{const id=$('pid').value.trim();if(!id||!confirm('Удалить протокол?'))return;try{await api('/api/v1/user-protocols/'+encodeURIComponent(id),'DELETE');edit(null);await load()}catch(e){alert(e.message)}};$('run').onclick=()=>{const id=$('pid').value.trim();if(id)location.href='test-run.html?source=user&id='+encodeURIComponent(id)};load();edit(null);</script></body></html>
