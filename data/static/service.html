<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сервисная информация</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="settings.html">← Назад</a><div class="crumb">Настройки · сервисная информация</div></header><main class="content"><section class="panel"><div id="health" class="metric-grid"></div><div class="section-title" style="margin-top:18px"><h2>Лимиты ядра</h2><button id="reload" class="btn">Обновить</button></div><div id="limits" class="metric-grid"></div><div class="panel" style="margin-top:18px"><h3>REST API</h3><p><span class="kbd">GET /api/v1/state</span> — телеметрия</p><p><span class="kbd">POST /api/v1/control/targets</span> — скорость/уклон</p><p><span class="kbd">POST /api/v1/control/start</span> — запуск режима</p><p><span class="kbd">POST /api/v1/control/stop</span> — остановка</p><p><span class="kbd">POST /api/v1/control/emergency-stop</span> — аварийный стоп</p></div></section></main></div><script src="app.js"></script><script>async function load(){try{const h=await api('/api/v1/health'),c=await api('/api/v1/config');$('health').innerHTML=`<div class="metric"><div class="label">Сервис</div><div class="value">${esc(h.service)}</div></div><div class="metric"><div class="label">Версия</div><div class="value">${esc(h.version)}</div></div><div class="metric"><div class="label">Драйвер</div><div class="value">${esc(h.driver)}</div></div>`;const l=c.limits;$('limits').innerHTML=`<div class="metric"><div class="label">Макс. скорость</div><div class="value">${l.max_speed_kmh}<span class="unit">км/ч</span></div></div><div class="metric"><div class="label">Макс. уклон</div><div class="value">${l.max_incline_percent}<span class="unit">%</span></div></div><div class="metric"><div class="label">Разгон</div><div class="value">${Number(l.max_accel_kmh_per_s).toFixed(3)}<span class="unit">км/ч/с</span></div></div><div class="metric"><div class="label">Торможение</div><div class="value">${Number(l.max_decel_kmh_per_s).toFixed(3)}<span class="unit">км/ч/с</span></div></div><div class="metric"><div class="label">Watchdog</div><div class="value">${l.watchdog_seconds}<span class="unit">с</span></div></div>`}catch(e){$('health').innerHTML=`<div class="dangerbox">${esc(e.message)}</div>`}}$('reload').onclick=load;load();</script></body></html>
