<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профили — Yadro</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><div class="brand">YADRO / ПРОФИЛИ</div><nav><a href="/index.html">Управление</a><a href="/protocols.html">Протоколы</a><a class="active" href="/profiles.html">Профили</a><a href="/patients.html">Пациенты</a><a href="/settings.html">Настройки</a></nav></header><main class="wrap"><div class="page-title"><div><h1>Редактор профилей</h1><div class="small">Интервалы: длительность, скорость, уклон и уровень ускорения.</div></div><button class="btn-primary" onclick="newProfile()">Новый профиль</button></div><section class="grid controls"><div class="card"><h2>Сохранённые профили</h2><div id="profiles"></div></div><div class="card"><h2 id="editorTitle">Новый профиль</h2><div class="form-grid"><label>ID<input id="pid" placeholder="lesenka"></label><label>Название<input id="pname" placeholder="Лесенка"></label></div><label>Описание<textarea id="pdesc"></textarea></label><h3>Интервалы</h3><div class="table-wrap"><table><thead><tr><th>№</th><th>Время, с</th><th>Скорость, км/ч</th><th>Уклон, %</th><th>Ускорение 1–7</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="button-row"><button class="btn-secondary" onclick="addRow()">+ Добавить интервал</button><button class="btn-success" onclick="save()">Сохранить</button><button class="btn-primary" onclick="runCurrent()">Запустить</button></div></div></section></main><script>let cache=[];const $=x=>document.getElementById(x);async function api(p,m='GET',b){const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.message||'Ошибка');return j}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){cache=(await api('/api/v1/profiles')).items;$('profiles').innerHTML=cache.length?cache.map(p=>`<div style="padding:10px 0;border-bottom:1px solid #e2eaf2"><b>${esc(p.name)}</b> <span class="small">(${esc(p.id)})</span><div class="button-row"><button class="btn-secondary" onclick="edit('${p.id}')">Изменить</button><button class="btn-primary" onclick="run('${p.id}')">Пуск</button><button class="btn-danger" onclick="delp('${p.id}')">Удалить</button></div></div>`).join(''):'<div class="small">Профилей пока нет.</div>'}function row(v={duration_seconds:60,speed_kmh:1,incline_percent:0,acceleration_level:3}){const tr=document.createElement('tr');tr.innerHTML=`<td class="idx"></td><td><input type="number" min="1" value="${v.duration_seconds}" class="dur"></td><td><input type="number" min="0" step="0.1" value="${v.speed_kmh}" class="spd"></td><td><input type="number" min="0" step="0.1" value="${v.incline_percent}" class="inc"></td><td><input type="number" min="1" max="7" value="${v.acceleration_level}" class="acc"></td><td><button class="btn-danger" onclick="this.closest('tr').remove();renumber()">×</button></td>`;$('rows').appendChild(tr);renumber()}function renumber(){[...$('rows').children].forEach((r,i)=>r.querySelector('.idx').textContent=i+1)}function addRow(){row()}function newProfile(){$('pid').value='';$('pname').value='';$('pdesc').value='';$('rows').innerHTML='';row();$('editorTitle').textContent='Новый профиль'}function edit(id){const p=cache.find(x=>x.id===id);if(!p)return;$('pid').value=p.id;$('pname').value=p.name;$('pdesc').value=p.description||'';$('rows').innerHTML='';p.intervals.forEach(row);$('editorTitle').textContent='Редактирование: '+p.name}function collect(){return{id:$('pid').value.trim(),name:$('pname').value.trim(),description:$('pdesc').value.trim(),intervals:[...$('rows').children].map(r=>({duration_seconds:Number(r.querySelector('.dur').value),speed_kmh:Number(r.querySelector('.spd').value),incline_percent:Number(r.querySelector('.inc').value),acceleration_level:Number(r.querySelector('.acc').value)}))}}async function save(){try{await api('/api/v1/profiles','POST',collect());await load();alert('Сохранено')}catch(e){alert(e.message)}}async function run(id){try{await api('/api/v1/control/start','POST',{mode:'profile',program_id:id});location.href='/index.html'}catch(e){alert(e.message)}}async function runCurrent(){try{await save();const id=$('pid').value.trim();if(id)await run(id)}catch(e){alert(e.message)}}async function delp(id){if(!confirm('Удалить профиль?'))return;try{await api('/api/v1/profiles/'+id,'DELETE');await load();newProfile()}catch(e){alert(e.message)}}setInterval(()=>api('/api/v1/heartbeat','POST',{}).catch(()=>{}),1000);newProfile();load();</script></body></html>
