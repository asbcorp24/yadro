<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профили</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="index.html">← Назад</a><div class="crumb">Процедуры · бег по профилю</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><section class="panel"><div class="section-title"><h2>Профили нагрузки</h2><a class="btn primary" href="profile-editor.html">+ Новый профиль</a></div><div id="list" class="choice-list"></div></section></main></div><script src="app.js"></script><script>async function load(){const items=(await api('/api/v1/profiles')).items;$('list').innerHTML=items.map(p=>`<div class="choice"><div class="grow"><strong>${esc(p.name)}</strong><div class="muted">${esc(p.description||'')} · ${p.intervals.length} интервалов</div></div><div class="toolbar mb-0"><a class="btn" href="profile-editor.html?id=${encodeURIComponent(p.id)}">Редактировать</a><a class="btn primary" href="profile-run.html?id=${encodeURIComponent(p.id)}">Запустить</a></div></div>`).join('')||'<div class="empty">Профили ещё не созданы</div>';enhanceBootstrap()}load();</script></body></html>
