<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Выполнение протокола</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="protocols.html">← Назад</a><div id="title" class="crumb">Тестирование</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><div class="split"><section class="panel"><h2 id="protocolName">Протокол</h2><div class="table-wrap"><table class="table"><thead><tr><th>Ступень</th><th>Длительность</th><th>Скорость</th><th>Уклон</th><th>Разгон</th></tr></thead><tbody id="steps"></tbody></table></div></section><section class="panel"><div id="runStatus" class="status">Остановлена</div><div class="metric-grid" style="margin-top:16px"><div class="metric"><div class="label">Время</div><div id="elapsed" class="value">00:00:00</div></div><div class="metric"><div class="label">Осталось ступени</div><div id="remaining" class="value">—</div></div><div class="metric"><div class="label">Мощность</div><div><span id="power" class="value">0</span><span class="unit">Вт</span></div></div><div class="metric"><div class="label">ЧСС</div><div><span id="hr" class="value">0</span><span class="unit">уд/мин</span></div></div><div class="metric"><div class="label">Макс. ЧСС</div><div><span id="maxHr" class="value">0</span><span class="unit">уд/мин</span></div></div><div class="metric"><div class="label">Скорость</div><div><span id="speed" class="value">0</span><span class="unit">км/ч</span></div></div></div><div class="hero-actions"><button id="start" class="start-btn">▶ ПУСК</button><button id="stop" class="stop-btn">■ СТОП</button></div><div id="notice" class="notice">Выберите пациента перед процедурой, если результат нужно сохранить в его историю.</div></section></div></main><button id="globalEstop" class="estop">STOP</button></div><script src="app.js"></script><script>let protocol=null;const source=qs('source','standard'),id=qs('id');async function load(){const path=source==='user'?'/api/v1/user-protocols':'/api/v1/protocols';const j=await api(path);protocol=j.items.find(x=>x.id===id);if(!protocol)throw new Error('Протокол не найден');$('protocolName').textContent=protocol.name;$('title').textContent='Тестирование · '+protocol.name;$('steps').innerHTML=protocol.intervals.map((x,i)=>`<tr id="step${i}"><td>${i+1}</td><td>${fmtTime(x.duration_seconds)}</td><td>${x.speed_kmh.toFixed(1)} км/ч</td><td>${x.incline_percent.toFixed(1)} %</td><td>${x.acceleration_level}</td></tr>`).join('');$('start').disabled=!protocol.implemented}function render(t){if(!t)return;$('runStatus').textContent=humanState(t.state);$('runStatus').className='status '+t.state;$('elapsed').textContent=fmtTime(t.elapsed_seconds);$('remaining').textContent=t.interval_index>=0?fmtTime(t.interval_remaining_seconds):'—';$('power').textContent=t.mechanical_power_w_estimate.toFixed(0);$('hr').textContent=t.heart_rate_bpm;$('maxHr').textContent=t.max_heart_rate_bpm;$('speed').textContent=t.speed_kmh.toFixed(1);$('notice').textContent=t.notice||'Протокол готов';document.querySelectorAll('#steps tr').forEach(r=>r.classList.remove('active'));if(t.interval_index>=0)$('step'+t.interval_index)?.classList.add('active')}$('start').onclick=async()=>{try{await api('/api/v1/control/start','POST',{mode:source==='user'?'user_protocol':'protocol',program_id:id});toast('Протокол запущен')}catch(e){alert(e.message)}};$('stop').onclick=()=>api('/api/v1/control/stop','POST',{}).catch(e=>alert(e.message));load().catch(e=>alert(e.message));setInterval(()=>pollState(render),300);pollState(render);</script></body></html>
