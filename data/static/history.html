<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>История пациентов</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="patients.html">← Назад</a><div class="crumb">Пациенты · история пациентов</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><section class="panel"><div class="toolbar"><select id="patientFilter"><option value="">Все пациенты</option></select><button id="reload" class="btn">Обновить</button></div><div class="table-wrap"><table class="table"><thead><tr><th>№</th><th>Дата</th><th>Пациент</th><th>Профиль/режим</th><th>Длительность</th><th>Расстояние</th><th>Подробнее</th></tr></thead><tbody id="tbody"></tbody></table></div></section></main></div><script src="app.js"></script><script>let patients=[];async function loadPatients(){patients=(await api('/api/v1/patients')).items;$('patientFilter').innerHTML='<option value="">Все пациенты</option>'+patients.map(p=>`<option value="${p.id}">${esc([p.last_name,p.first_name].filter(Boolean).join(' ')||p.id)}</option>`).join('');const sid=(await api('/api/v1/session/patient')).patient_id;if(sid)$('patientFilter').value=sid}function pname(id){const p=patients.find(x=>x.id===id);return p?[p.last_name,p.first_name,p.middle_name].filter(Boolean).join(' '):id||'—'}async function load(){const id=$('patientFilter').value;const path='/api/v1/history'+(id?'?patient_id='+encodeURIComponent(id):'');const h=(await api(path)).items;$('tbody').innerHTML=h.map((x,i)=>`<tr><td>${i+1}</td><td>${esc((x.started_at||'').replace('T',' '))}</td><td>${esc(pname(x.patient_id))}</td><td>${esc(x.program_id||humanSession(x.session))}</td><td>${fmtTime(x.duration_seconds)}</td><td>${Number(x.distance_km||0).toFixed(3)} км</td><td><a class="btn" href="history-detail.html?id=${encodeURIComponent(x.id)}">Открыть</a></td></tr>`).join('')||'<tr><td colspan="7" class="empty">История пока пуста</td></tr>'}$('patientFilter').onchange=load;$('reload').onclick=load;(async()=>{await loadPatients();await load()})();</script></body></html>
