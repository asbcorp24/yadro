<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бег по профилю</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="profiles.html">← Назад</a><div id="title" class="crumb">Бег по профилю</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><div class="split"><section class="panel"><h2>Профиль</h2><div class="table-wrap"><table class="table"><thead><tr><th>Интервал</th><th>Разгон</th><th>Скорость</th><th>Время</th><th>Уклон</th></tr></thead><tbody id="steps"></tbody></table></div></section><section class="panel"><div class="metric-grid"><div class="metric"><div class="label">Время</div><div id="elapsed" class="value">00:00:00</div></div><div class="metric"><div class="label">Скорость</div><div id="speed" class="value">0.0</div></div><div class="metric"><div class="label">Уклон</div><div id="incline" class="value">0.0</div></div><div class="metric"><div class="label">ЧСС</div><div id="hr" class="value">0</div></div></div><div class="hero-actions"><button id="start" class="start-btn">▶ ПУСК</button><button id="stop" class="stop-btn">■ СТОП</button></div><div id="status" class="status">Остановлена</div></section></div></main><button id="globalEstop" class="estop">STOP</button></div><script src="app.js"></script><script>const id=qs('id');let profile=null;(async()=>{const j=await api('/api/v1/profiles');profile=j.items.find(x=>x.id===id);if(!profile)return alert('Профиль не найден');$('title').textContent='Бег по профилю · '+profile.name;$('steps').innerHTML=profile.intervals.map((x,i)=>`<tr id="step${i}"><td>${i+1}</td><td>${x.acceleration_level}</td><td>${x.speed_kmh.toFixed(1)}</td><td>${fmtTime(x.duration_seconds)}</td><td>${x.incline_percent.toFixed(1)} %</td></tr>`).join('')})();function render(t){if(!t)return;$('elapsed').textContent=fmtTime(t.elapsed_seconds);$('speed').textContent=t.speed_kmh.toFixed(1);$('incline').textContent=t.incline_percent.toFixed(1);$('hr').textContent=t.heart_rate_bpm;$('status').textContent=humanState(t.state);$('status').className='status '+t.state;document.querySelectorAll('#steps tr').forEach(r=>r.classList.remove('active'));if(t.interval_index>=0)$('step'+t.interval_index)?.classList.add('active')}$('start').onclick=()=>api('/api/v1/control/start','POST',{mode:'profile',program_id:id}).catch(e=>alert(e.message));$('stop').onclick=()=>api('/api/v1/control/stop','POST',{}).catch(e=>alert(e.message));setInterval(()=>pollState(render),300);pollState(render);</script></body></html>
