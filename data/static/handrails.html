<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REMOTION — поручни</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="settings.html">← Назад</a><div class="crumb">Настройки · высота поручней</div></header><main class="content"><div class="split"><section class="panel"><h2>Высота основных поручней</h2><div class="field"><label>Целевая высота, мм</label><input id="height" type="range" min="726" max="1376" value="1000"><div><span id="heightValue" class="value">1000</span> мм</div></div><div class="hero-actions"><button class="btn primary" id="up">Поднять</button><button class="btn" id="down">Опустить</button><button class="btn danger" id="stop">Стоп</button></div><div class="notice">По спецификации автоматический диапазон 726–1376 мм, скорость подъёма до 35 мм/с. Команды пока не отправляются в ПЛК до подключения реального драйвера колонн.</div></section><section class="panel"><h2>Состояние колонн</h2><div class="metric-grid"><div class="metric"><div class="label">Колонна 1</div><div class="value">—</div></div><div class="metric"><div class="label">Колонна 2</div><div class="value">—</div></div><div class="metric"><div class="label">Колонна 3</div><div class="value">—</div></div><div class="metric"><div class="label">Колонна 4</div><div class="value">—</div></div></div></section></div></main></div><script src="app.js"></script><script>$('height').oninput=e=>$('heightValue').textContent=e.target.value;['up','down','stop'].forEach(id=>$(id).onclick=()=>alert('Интерфейс готов. Команда станет активной после подключения PLC/Modbus драйвера поручней.'));</script></body></html>
