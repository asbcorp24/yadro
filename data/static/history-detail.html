<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>История процедуры</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="history.html">← Назад</a><div class="crumb">Пациенты · история процедуры · расширенные показатели</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><section id="panel" class="panel"><div class="empty">Загрузка…</div></section></main></div><script src="app.js"></script><script>(async()=>{const id=qs('id'),items=(await api('/api/v1/history')).items,x=items.find(v=>v.id===id);if(!x){$('panel').innerHTML='<div class="dangerbox">Запись не найдена</div>';return}const patients=(await api('/api/v1/patients')).items,p=patients.find(v=>v.id===x.patient_id);$('panel').innerHTML=`<div class="section-title"><h2>${esc([p?.last_name,p?.first_name,p?.middle_name].filter(Boolean).join(' ')||x.patient_id||'Без пациента')}</h2><button id="deleteRow" class="btn danger">Удалить запись</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Длительность, ч</th><th>Длительность, м</th><th>Длительность, с</th><th>Расстояние, км</th><th>Скорость, км/ч</th><th>Ускорение, м/с²</th><th>Угол, %</th><th>Пульс</th><th>Энергия, ккал</th><th>Мощность, Вт</th></tr></thead><tbody><tr><td>${Math.floor(x.duration_seconds/3600)}</td><td>${Math.floor((x.duration_seconds%3600)/60)}</td><td>${Math.floor(x.duration_seconds%60)}</td><td>${Number(x.distance_km||0).toFixed(3)}</td><td>${Number(x.average_speed_kmh||0).toFixed(3)}</td><td>${Number(x.max_acceleration_m_s2||0).toFixed(3)}</td><td>${Number(x.max_incline_percent||0).toFixed(2)}</td><td>${Number(x.max_heart_rate_bpm||0)}</td><td>${Number(x.energy_kcal_estimate||0).toFixed(3)}</td><td>${Number(x.max_power_w_estimate||0).toFixed(3)}</td></tr></tbody></table></div><div class="metric-grid" style="margin-top:18px"><div class="metric"><div class="label">Начало</div><div class="value" style="font-size:1.05rem">${esc((x.started_at||'').replace('T',' '))}</div></div><div class="metric"><div class="label">Окончание</div><div class="value" style="font-size:1.05rem">${esc((x.finished_at||'').replace('T',' '))}</div></div><div class="metric"><div class="label">Режим</div><div class="value" style="font-size:1.05rem">${esc(x.program_id||humanSession(x.session))}</div></div></div><p class="footer-note">Показатели мощности и энергии помечены как оценки SimulationDriver. После подключения аппаратного драйвера сюда должны попадать измеренные данные контроллера.</p>`;$('deleteRow').onclick=async()=>{if(confirm('Удалить запись истории?')){await api('/api/v1/history/'+encodeURIComponent(id),'DELETE');location.href='history.html'}}})();</script></body></html>
