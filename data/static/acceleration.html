<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ускорение и торможение</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="settings.html">← Назад</a><div class="crumb">Настройки · задание ускорения и торможения</div></header><main class="content"><div class="split"><section class="panel"><h2>Уровень ускорения</h2><div id="accelLevels" class="levels"></div><div class="form-grid" style="margin-top:16px"><div class="field"><label>Время разгона 0→10 км/ч, с</label><input id="accelTime" type="number" min="1" step="1"></div><div class="field"><label>Ускорение, м/с²</label><input id="accelValue" disabled></div></div><div id="accelChart" class="chartbox" style="margin-top:16px"></div></section><section class="panel"><h2>Уровень торможения</h2><div id="brakeLevels" class="levels"></div><div class="form-grid" style="margin-top:16px"><div class="field"><label>Время торможения 10→0 км/ч, с</label><input id="brakeTime" type="number" min="1" step="1"></div><div class="field"><label>Торможение, м/с²</label><input id="brakeValue" disabled></div></div><div id="brakeChart" class="chartbox" style="margin-top:16px"></div></section></div><div class="toolbar" style="margin-top:18px"><button id="save" class="btn success big">Сохранить настройки</button></div></main></div><script src="app.js"></script><script>let s,al=4,bl=4;function renderLevels(id,selected,fn){$(id).innerHTML=[1,2,3,4,5,6,7].map(x=>`<button class="level ${x===selected?'selected':''}" data-v="${x}">${x}</button>`).join('');$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>fn(Number(b.dataset.v)))}function calc(){const at=Number($('accelTime').value)||1,bt=Number($('brakeTime').value)||1;$('accelValue').value=(10/3.6/at).toFixed(3);$('brakeValue').value=(10/3.6/bt).toFixed(3);drawSlopeChart('accelChart',s.motion.acceleration_times_seconds,al,false);drawSlopeChart('brakeChart',s.motion.braking_times_seconds,bl,true)}function chooseA(v){al=v;renderLevels('accelLevels',al,chooseA);$('accelTime').value=s.motion.acceleration_times_seconds[al-1];calc()}function chooseB(v){bl=v;renderLevels('brakeLevels',bl,chooseB);$('brakeTime').value=s.motion.braking_times_seconds[bl-1];calc()}(async()=>{s=await loadSettings();al=s.motion.acceleration_level;bl=s.motion.braking_level;chooseA(al);chooseB(bl)})();$('accelTime').oninput=()=>{s.motion.acceleration_times_seconds[al-1]=Number($('accelTime').value);calc()};$('brakeTime').oninput=()=>{s.motion.braking_times_seconds[bl-1]=Number($('brakeTime').value);calc()};$('save').onclick=async()=>{try{s.motion.acceleration_level=al;s.motion.braking_level=bl;await api('/api/v1/settings','POST',{motion:s.motion});toast('Настройки применены к C++ драйверу')}catch(e){alert(e.message)}};</script></body></html>
