<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Калибровка дорожки</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="settings.html">← Назад</a><div class="crumb">Настройки · калибровка положения беговой дорожки</div></header><main class="content"><section class="panel"><div class="section-title"><h2>Угол подъёма</h2><div><span id="angle" class="value">0.00</span><span class="unit">%</span></div></div><div class="chartbox" style="display:grid;place-items:center"><div style="text-align:center"><div style="font-size:5rem">🏃‍♂️</div><div class="muted">Установите полотно максимально близко к горизонтали и нажмите «Установить ноль»</div></div></div><div id="result" class="notice" style="margin-top:16px">Коррекция применяется только к отображаемому значению датчика. Физические концевики и аппаратная защита должны оставаться независимыми.</div><div class="hero-actions"><button id="zero" class="btn success big">✓ Установить ноль</button></div></section></main></div><script src="app.js"></script><script>function render(t){if(t)$('angle').textContent=Number(t.incline_percent).toFixed(2)}$('zero').onclick=async()=>{if(!confirm('Сохранить текущее положение как нулевое?'))return;try{const j=await api('/api/v1/calibration/zero','POST',{});$('result').className='okbox';$('result').textContent='Калибровка выполнена. Смещение: '+Number(j.offset_percent).toFixed(2)+' %'}catch(e){alert(e.message)}};setInterval(()=>pollState(render),500);pollState(render);</script></body></html>
