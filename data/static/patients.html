<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>База пациентов</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="index.html">← Назад</a><div class="crumb">Пациенты · база пациентов</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><section class="panel"><div class="toolbar"><input id="search" class="form-control" placeholder="Быстрый фильтр списка" style="flex:1;min-width:220px"><a class="btn" href="patient-search.html">Поиск</a><a class="btn primary" href="patient-edit.html">+ Пациент</a><button id="clearSelection" class="btn">Снять выбор</button></div><div class="table-wrap"><table class="table"><thead><tr><th>№</th><th>Фамилия</th><th>Имя</th><th>Отчество</th><th>Пол</th><th>Возраст</th><th>Вес</th><th>Диагноз</th><th>Врач</th><th>Аккаунт</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div><div class="toolbar mt-3"><a class="btn" href="patient-detail.html">Детализация</a><a class="btn" href="patient-stats.html">Статистика</a><a class="btn" href="patient-history.html">История выбранного</a><a class="btn" href="history.html">Вся история</a></div></section></main></div><script src="app.js"></script><script>let patients=[],selected='';async function load(){patients=(await api('/api/v1/patients')).items;selected=(await api('/api/v1/session/patient')).patient_id;render()}function render(){const q=$('search').value.toLowerCase();const rows=patients.filter(p=>JSON.stringify(p).toLowerCase().includes(q));$('tbody').innerHTML=rows.map((p,i)=>`<tr class="clickable ${p.id===selected?'active':''}" data-id="${p.id}"><td>${i+1}</td><td>${esc(p.last_name||'')}</td><td>${esc(p.first_name||'')}</td><td>${esc(p.middle_name||'')}</td><td>${esc(p.sex||'')}</td><td>${esc(p.age??'')}</td><td>${esc(p.weight_kg??'')}</td><td>${esc(p.diagnosis||'')}</td><td>${esc(p.doctor||'')}</td><td>${p.account_active===false?'✕':'✓'}</td><td><a class="btn" href="patient-edit.html?id=${encodeURIComponent(p.id)}">✎</a></td></tr>`).join('')||'<tr><td colspan="11" class="empty">Нет пациентов</td></tr>';document.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=async e=>{if(e.target.closest('a,button'))return;await selectPatient(r.dataset.id);selected=r.dataset.id;render()});enhanceBootstrap()}$('search').oninput=render;$('clearSelection').onclick=async()=>{await selectPatient('');selected='';render()};load();</script></body></html>
