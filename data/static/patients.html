<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>База пациентов</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="index.html">← Назад</a><div class="crumb">Пациенты · база пациентов</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><section class="panel"><div class="toolbar"><input id="search" placeholder="Поиск пациента" style="flex:1;min-width:220px;padding:12px;border:1px solid var(--line);border-radius:12px"><button id="newBtn" class="btn primary">+ Пациент</button><button id="clearSelection" class="btn">Снять выбор</button></div><div class="table-wrap"><table class="table"><thead><tr><th>№</th><th>Фамилия</th><th>Имя</th><th>Отчество</th><th>Пол</th><th>Возраст</th><th>Вес</th><th>Диагноз</th><th>Врач</th><th>Аккаунт</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div><div class="toolbar" style="margin-top:16px"><a class="btn" href="patient-detail.html">Детализация</a><a class="btn" href="patient-stats.html">Статистика</a><a class="btn" href="history.html">История пациентов</a></div></section></main><div id="editModal" class="modal"><div class="modal-card"><div class="section-title"><h2>Карточка пациента</h2><button id="closeModal" class="btn">Закрыть</button></div><div class="form-grid"><div class="field"><label>ID</label><input id="pId"></div><div class="field"><label>Фамилия</label><input id="lastName"></div><div class="field"><label>Имя</label><input id="firstName"></div><div class="field"><label>Отчество</label><input id="middleName"></div><div class="field"><label>Пол</label><select id="sex"><option value="M">М</option><option value="F">Ж</option></select></div><div class="field"><label>Возраст</label><input id="age" type="number" min="0" max="120"></div><div class="field"><label>Вес, кг</label><input id="weight" type="number" min="1" step="0.1"></div><div class="field"><label>Врач</label><input id="doctor"></div><div class="field"><label>Диагноз</label><input id="diagnosis"></div><div class="field"><label>Профиль</label><input id="profile"></div><div class="field"><label>Учётная запись</label><select id="account"><option value="true">Активна</option><option value="false">Отключена</option></select></div></div><div class="toolbar" style="margin-top:18px"><button id="savePatient" class="btn success">Сохранить</button><button id="deletePatient" class="btn danger">Удалить</button></div></div></div><script src="app.js"></script><script>let patients=[],selected='';async function load(){patients=(await api('/api/v1/patients')).items;selected=(await api('/api/v1/session/patient')).patient_id;render()}function render(){const q=$('search').value.toLowerCase();const rows=patients.filter(p=>JSON.stringify(p).toLowerCase().includes(q));$('tbody').innerHTML=rows.map((p,i)=>`<tr class="clickable ${p.id===selected?'active':''}" data-id="${p.id}"><td>${i+1}</td><td>${esc(p.last_name||'')}</td><td>${esc(p.first_name||'')}</td><td>${esc(p.middle_name||'')}</td><td>${esc(p.sex||'')}</td><td>${esc(p.age??'')}</td><td>${esc(p.weight_kg??'')}</td><td>${esc(p.diagnosis||'')}</td><td>${esc(p.doctor||'')}</td><td>${p.account_active===false?'✕':'✓'}</td><td><button class="btn edit" data-edit="${p.id}">✎</button></td></tr>`).join('')||'<tr><td colspan="11" class="empty">Нет пациентов</td></tr>';document.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=async e=>{if(e.target.closest('.edit'))return;await selectPatient(r.dataset.id);selected=r.dataset.id;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(patients.find(p=>p.id===b.dataset.edit)))}function openEdit(p={}){$('pId').value=p.id||('patient_'+Date.now());$('pId').disabled=!!p.id;$('lastName').value=p.last_name||'';$('firstName').value=p.first_name||'';$('middleName').value=p.middle_name||'';$('sex').value=p.sex||'M';$('age').value=p.age??'';$('weight').value=p.weight_kg??'';$('doctor').value=p.doctor||'';$('diagnosis').value=p.diagnosis||'';$('profile').value=p.profile||'';$('account').value=String(p.account_active!==false);$('editModal').classList.add('open')}function patientPayload(){return{id:$('pId').value.trim(),last_name:$('lastName').value.trim(),first_name:$('firstName').value.trim(),middle_name:$('middleName').value.trim(),sex:$('sex').value,age:Number($('age').value)||0,weight_kg:Number($('weight').value)||0,doctor:$('doctor').value.trim(),diagnosis:$('diagnosis').value.trim(),profile:$('profile').value.trim(),account_active:$('account').value==='true'}}$('search').oninput=render;$('newBtn').onclick=()=>openEdit();$('closeModal').onclick=()=>{$('editModal').classList.remove('open')};$('savePatient').onclick=async()=>{try{await api('/api/v1/patients','POST',patientPayload());$('editModal').classList.remove('open');toast('Пациент сохранён');await load()}catch(e){alert(e.message)}};$('deletePatient').onclick=async()=>{const id=$('pId').value.trim();if(id&&confirm('Удалить пациента?')){try{await api('/api/v1/patients/'+encodeURIComponent(id),'DELETE');if(selected===id)await selectPatient('');$('editModal').classList.remove('open');load()}catch(e){alert(e.message)}}};$('clearSelection').onclick=async()=>{await selectPatient('');selected='';render()};load();</script></body></html>
