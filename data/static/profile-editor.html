<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор профиля</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="profiles.html">← Назад</a><div class="crumb">Профили · отдельный редактор</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><section class="panel"><div class="form-grid"><div class="field"><label>ID</label><input id="pid"></div><div class="field"><label>Название</label><input id="pname" placeholder="лесенка"></div></div><div class="field mt-3"><label>Описание</label><textarea id="pdesc"></textarea></div><div class="section-title mt-4"><h3>Интервалы</h3><button id="addRow" class="btn">+ Интервал</button></div><div class="table-wrap"><table class="table"><thead><tr><th>№</th><th>Ускорение</th><th>Скорость, км/ч</th><th>Время, с</th><th>Уклон, %</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="toolbar mt-3"><button id="save" class="btn success">Сохранить</button><button id="run" class="btn primary">Запустить</button><button id="del" class="btn danger">Удалить</button></div></section></main></div><script src="app.js"></script><script>let current=null;function add(v={acceleration_level:3,speed_kmh:1,duration_seconds:10,incline_percent:0}){const tr=document.createElement('tr');tr.innerHTML=`<td class="n"></td><td><select>${[1,2,3,4,5,6,7].map(x=>`<option ${x===Number(v.acceleration_level)?'selected':''}>${x}</option>`).join('')}</select></td><td><input type="number" step="0.1" min="0" value="${Number(v.speed_kmh||0)}"></td><td><input type="number" min="1" value="${Number(v.duration_seconds||10)}"></td><td><input type="number" step="0.1" min="0" value="${Number(v.incline_percent||0)}"></td><td><button class="btn danger">×</button></td>`;tr.querySelector('button').onclick=()=>{tr.remove();renum()};$('rows').appendChild(tr);renum();enhanceBootstrap(tr)}function renum(){[...$('rows').children].forEach((r,i)=>r.querySelector('.n').textContent=i+1)}function fill(p){current=p||null;$('pid').value=p?.id||('profile_'+Date.now());$('pname').value=p?.name||'';$('pdesc').value=p?.description||'';$('rows').innerHTML='';(p?.intervals||[{acceleration_level:3,speed_kmh:1,duration_seconds:10,incline_percent:0}]).forEach(add)}function payload(){return{id:$('pid').value.trim(),name:$('pname').value.trim(),description:$('pdesc').value.trim(),intervals:[...$('rows').children].map(r=>{const a=r.querySelectorAll('select,input');return{acceleration_level:Number(a[0].value),speed_kmh:Number(a[1].value),duration_seconds:Number(a[2].value),incline_percent:Number(a[3].value)}})}}async function load(){const id=qs('id');if(!id){fill(null);return}const items=(await api('/api/v1/profiles')).items;fill(items.find(x=>x.id===id)||null)}$('addRow').onclick=()=>add();$('save').onclick=async()=>{try{await api('/api/v1/profiles','POST',payload());toast('Профиль сохранён')}catch(e){alert(e.message)}};$('run').onclick=()=>{const id=$('pid').value.trim();if(id)location.href='profile-run.html?id='+encodeURIComponent(id)};$('del').onclick=async()=>{const id=$('pid').value.trim();if(id&&confirm('Удалить профиль?')){await api('/api/v1/profiles/'+encodeURIComponent(id),'DELETE');location.href='profiles.html'}};load();</script></body></html>
