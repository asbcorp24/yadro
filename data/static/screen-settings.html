<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Экран пульта</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="settings.html">← Назад</a><div class="crumb">Настройки · экран пульта управления</div></header><main class="content"><section class="panel"><div class="form-grid"><div class="field"><label>Масштаб текста</label><input id="fontScale" type="range" min="0.8" max="1.35" step="0.05"><div><span id="fontScaleValue"></span>×</div></div><div class="field"><label>Высокая контрастность</label><select id="contrast"><option value="false">Выключена</option><option value="true">Включена</option></select></div><div class="field"><label>Компактный режим</label><select id="compact"><option value="false">Выключен</option><option value="true">Включен</option></select></div></div><div class="panel" style="margin-top:18px"><h3>Предпросмотр</h3><div class="metric-grid"><div class="metric"><div class="label">Скорость</div><div class="value">5.4 <span class="unit">км/ч</span></div></div><div class="metric"><div class="label">ЧСС</div><div class="value">112 <span class="unit">уд/мин</span></div></div></div></div><button id="save" class="btn success big" style="margin-top:18px">Сохранить</button></section></main></div><script src="app.js"></script><script>let ui;(async()=>{const s=await loadSettings();ui=s.ui;$('fontScale').value=ui.font_scale;$('fontScaleValue').textContent=ui.font_scale;$('contrast').value=String(!!ui.high_contrast);$('compact').value=String(!!ui.compact)})();$('fontScale').oninput=e=>{$('fontScaleValue').textContent=e.target.value;document.documentElement.style.setProperty('--font-scale',e.target.value)};$('contrast').onchange=e=>document.body.classList.toggle('high-contrast',e.target.value==='true');$('save').onclick=async()=>{ui={font_scale:Number($('fontScale').value),high_contrast:$('contrast').value==='true',compact:$('compact').value==='true'};try{await api('/api/v1/settings','POST',{ui});toast('Настройки экрана сохранены')}catch(e){alert(e.message)}};</script></body></html>
