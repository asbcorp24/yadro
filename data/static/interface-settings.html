<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Настройки интерфейса</title><link rel="stylesheet" href="style.css"><style>.theme-presets{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:22px}.theme-card{position:relative;min-height:150px;border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--panel);color:var(--text);text-align:left;overflow:hidden}.theme-card.active{outline:2px solid var(--cyan,#00e5ff);box-shadow:0 0 24px rgba(0,213,255,.18)}.theme-card .swatches{display:flex;gap:7px;margin:14px 0}.theme-card .swatches i{width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.22)}.theme-card strong{font-size:1.1rem}.color-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.color-field{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}.color-field label{font-weight:800}.color-row{display:flex;gap:10px;align-items:center}.color-row input[type=color]{width:58px;height:42px;padding:2px;border:1px solid var(--line);border-radius:10px;background:transparent}.color-row input[type=text]{flex:1;min-width:0}.theme-preview{margin-top:20px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.preview-top{height:44px;border-radius:12px;background:linear-gradient(90deg,var(--navy),var(--blue),var(--blue2));margin-bottom:14px}.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.preview-box{min-height:82px;border-radius:12px;border:1px solid var(--line);background:rgba(15,40,70,.55);padding:12px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}@media(max-width:720px){.preview-grid{grid-template-columns:1fr}}</style></head><body><div class="app"><header class="topbar"><a class="back" href="settings.html">← Назад</a><div class="crumb">Настройки · интерфейс и цветовая гамма</div></header><main class="content"><section class="panel"><div class="section-title"><div><h2>Цветовая гамма интерфейса</h2><div class="muted">Пять фирменных схем REMOTION и ручная настройка. Выбор сохраняется и применяется ко всем экранам.</div></div></div><h3>Готовые пресеты</h3><div id="presetGrid" class="grid theme-presets"></div><h3>Своя цветовая схема</h3><div class="color-grid"><div class="color-field"><label>Основной акцент</label><div class="color-row"><input id="accent" type="color"><input id="accentText" type="text" maxlength="7"></div></div><div class="color-field"><label>Второй акцент</label><div class="color-row"><input id="accent2" type="color"><input id="accent2Text" type="text" maxlength="7"></div></div><div class="color-field"><label>Фон</label><div class="color-row"><input id="background" type="color"><input id="backgroundText" type="text" maxlength="7"></div></div><div class="color-field"><label>Панели</label><div class="color-row"><input id="panel" type="color"><input id="panelText" type="text" maxlength="7"></div></div><div class="color-field"><label>Текст</label><div class="color-row"><input id="text" type="color"><input id="textText" type="text" maxlength="7"></div></div><div class="color-field"><label>Вторичный текст</label><div class="color-row"><input id="muted" type="color"><input id="mutedText" type="text" maxlength="7"></div></div></div><div class="theme-preview"><h3>Предпросмотр</h3><div class="preview-top"></div><div class="preview-grid"><div class="preview-box"><strong>Скорость</strong><div style="font-size:1.7rem;font-weight:900;margin-top:8px">5.4 <span class="muted" style="font-size:.9rem">км/ч</span></div></div><div class="preview-box"><strong>ЧСС</strong><div style="font-size:1.7rem;font-weight:900;margin-top:8px">112 <span class="muted" style="font-size:.9rem">уд/мин</span></div></div><div class="preview-box"><button class="btn primary">Основная кнопка</button></div></div></div><div class="actions"><button id="saveTheme" class="btn success big">Сохранить цветовую схему</button><button id="resetTheme" class="btn">Антрацит по умолчанию</button></div></section></main></div><script src="app.js"></script><script>const PRESETS={anthracite:{name:'Антрацит',desc:'Тёмно-синий фон и белый текст',accent:'#2f8cff',accent2:'#00d5ff',background:'#07101f',panel:'#0d1b31',text:'#ffffff',muted:'#9bb1c8'},emerald:{name:'Изумруд',desc:'Фирменная зелёно-изумрудная гамма REMOTION',accent:'#10b981',accent2:'#34d399',background:'#061713',panel:'#0b2820',text:'#ecfff8',muted:'#92bdae'},turquoise:{name:'Бирюза',desc:'Оттенки голубого и бирюзового',accent:'#06b6d4',accent2:'#38bdf8',background:'#061822',panel:'#0a2b38',text:'#effcff',muted:'#8db9c7'},opal:{name:'Молочный опал',desc:'Молочно-песочная и коричневатая гамма',accent:'#b88758',accent2:'#d7b98e',background:'#f1eadf',panel:'#fffaf2',text:'#4a3829',muted:'#806b58'},sapphire:{name:'Сапфир',desc:'Сиреневато-розовая гамма',accent:'#8b5cf6',accent2:'#ec4899',background:'#150d25',panel:'#25163b',text:'#fff4ff',muted:'#c6a9d7'}};let ui={};let theme={};const fields=['accent','accent2','background','panel','text','muted'];function validHex(v){return /^#[0-9a-f]{6}$/i.test(v)}function syncField(name,value){$(name).value=value;$(name+'Text').value=value}function collectTheme(){const t={preset:'custom'};for(const f of fields)t[f]=$(f).value;return t}function preview(t){theme={...t};applyTheme(theme);document.querySelectorAll('.theme-card').forEach(x=>x.classList.toggle('active',x.dataset.preset===theme.preset));for(const f of fields)if(theme[f])syncField(f,theme[f])}function renderPresets(){const g=$('presetGrid');g.innerHTML='';for(const [id,p] of Object.entries(PRESETS)){const b=document.createElement('button');b.className='theme-card';b.dataset.preset=id;b.innerHTML=`<strong>${p.name}</strong><div class="muted">${p.desc}</div><div class="swatches"><i style="background:${p.background}"></i><i style="background:${p.panel}"></i><i style="background:${p.accent}"></i><i style="background:${p.accent2}"></i></div><span class="muted">Применить</span>`;b.onclick=()=>preview({...p,preset:id});g.appendChild(b)}}document.addEventListener('DOMContentLoaded',async()=>{renderPresets();const s=await loadSettings().catch(()=>({ui:{}}));ui=s.ui||{};theme=normalizeTheme(ui.theme);preview(theme);for(const f of fields){$(f).oninput=e=>{const t=collectTheme();t[f]=e.target.value;$(f+'Text').value=e.target.value;preview(t)};$(f+'Text').onchange=e=>{if(!validHex(e.target.value)){e.target.value=$(f).value;return}$(f).value=e.target.value;preview(collectTheme())}}$('saveTheme').onclick=async()=>{ui={...(ui||{}),theme:{...theme}};try{await api('/api/v1/settings','POST',{ui});yadroSettings={...(yadroSettings||{}),ui};applyUiSettings();toast('Цветовая схема сохранена')}catch(e){alert(e.message)}};$('resetTheme').onclick=()=>preview({...PRESETS.anthracite,preset:'anthracite'})});</script></body></html>
