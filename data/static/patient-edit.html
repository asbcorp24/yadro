<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Карточка пациента</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="topbar"><a class="back" href="patients.html">← Назад</a><div class="crumb">Пациенты · карточка пациента</div><div id="activePatientChip" class="patient-chip"></div></header><main class="content"><section class="panel"><div class="form-grid"><div class="field"><label>ID</label><input id="pId"></div><div class="field"><label>Фамилия</label><input id="lastName"></div><div class="field"><label>Имя</label><input id="firstName"></div><div class="field"><label>Отчество</label><input id="middleName"></div><div class="field"><label>Пол</label><select id="sex"><option value="M">М</option><option value="F">Ж</option></select></div><div class="field"><label>Возраст</label><input id="age" type="number" min="0" max="120"></div><div class="field"><label>Вес, кг</label><input id="weight" type="number" min="1" step="0.1"></div><div class="field"><label>Врач</label><input id="doctor"></div><div class="field"><label>Диагноз</label><input id="diagnosis"></div><div class="field"><label>Профиль</label><input id="profile"></div><div class="field"><label>Учётная запись</label><select id="account"><option value="true">Активна</option><option value="false">Отключена</option></select></div></div><div class="toolbar mt-4"><button id="savePatient" class="btn success">Сохранить</button><button id="selectPatientBtn" class="btn primary">Выбрать пациента</button><button id="deletePatient" class="btn danger">Удалить</button></div></section></main></div><script src="app.js"></script><script>let existing=false;function fill(p={}){existing=!!p.id;$('pId').value=p.id||('patient_'+Date.now());$('pId').disabled=existing;$('lastName').value=p.last_name||'';$('firstName').value=p.first_name||'';$('middleName').value=p.middle_name||'';$('sex').value=p.sex||'M';$('age').value=p.age??'';$('weight').value=p.weight_kg??'';$('doctor').value=p.doctor||'';$('diagnosis').value=p.diagnosis||'';$('profile').value=p.profile||'';$('account').value=String(p.account_active!==false)}function payload(){return{id:$('pId').value.trim(),last_name:$('lastName').value.trim(),first_name:$('firstName').value.trim(),middle_name:$('middleName').value.trim(),sex:$('sex').value,age:Number($('age').value)||0,weight_kg:Number($('weight').value)||0,doctor:$('doctor').value.trim(),diagnosis:$('diagnosis').value.trim(),profile:$('profile').value.trim(),account_active:$('account').value==='true'}}async function load(){const id=qs('id');if(!id){fill();return}const items=(await api('/api/v1/patients')).items;fill(items.find(x=>x.id===id)||{})}$('savePatient').onclick=async()=>{try{const p=payload();await api('/api/v1/patients','POST',p);toast('Пациент сохранён');existing=true;$('pId').disabled=true}catch(e){alert(e.message)}};$('selectPatientBtn').onclick=async()=>{const id=$('pId').value.trim();if(!id)return;await selectPatient(id);toast('Пациент выбран')};$('deletePatient').onclick=async()=>{const id=$('pId').value.trim();if(id&&existing&&confirm('Удалить пациента?')){await api('/api/v1/patients/'+encodeURIComponent(id),'DELETE');const s=await api('/api/v1/session/patient');if(s.patient_id===id)await selectPatient('');location.href='patients.html'}};load();</script></body></html>
